server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 2.27.206.15;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rafuk-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://2.27.206.15$request_uri;
    }
}
