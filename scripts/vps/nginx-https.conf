server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 2.27.206.15;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/rafuk-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rafuk-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RafukTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The inner nginx uses this trusted, overwritten header for per-client limits.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 60s;
    }
}
