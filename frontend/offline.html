<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <!--
      FE-M8: minimal offline fallback served by the Service Worker
      when both network and the runtime cache miss for a navigation
      request.  Self-contained (no external CSS, no fetches) so this
      page renders even if the SW just installed and has nothing
      else cached.  CSP-safe: no inline scripts, no inline event
      handlers — the only interactivity is a vanilla <a href> back
      to "/" which the SW can route to the cached shell.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>Rafuk — Нет связи</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <style>
        :root {
            color-scheme: dark light;
            --bg: #0d1117;
            --fg: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --border: rgba(255, 255, 255, 0.08);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --fg: #1f2328;
                --muted: #6b7177;
                --border: rgba(0, 0, 0, 0.08);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            line-height: 1.5;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            opacity: 0.7;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
        }
        p {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 15px;
        }
        a.retry {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            background: transparent;
        }
        a.retry:hover, a.retry:focus-visible {
            background: var(--border);
            outline: none;
        }
    </style>
</head>
<body>
<main class="card" role="main">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <h1>Нет связи с интернетом</h1>
    <p>
        Похоже, ваш телефон сейчас офлайн. Откроем приложение,
        как только сеть появится снова.
    </p>
    <a class="retry" href="/" aria-label="Повторить попытку">Повторить</a>
</main>
</body>
</html>
