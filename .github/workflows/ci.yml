name: CI

on:
  push:
    # SEC-LOW (issues §1.8): the 'bad-app' branch is the active dev
    # branch the CI exercises. Keep it listed for now; once the
    # workflow stabilises on main, drop bad-app and only run on the
    # release lane plus PRs.
    # RV-OPS-09: the integration branch is `dev`; there is no `develop`.
    branches: [main, dev, bad-app]
  pull_request:
    # RV-OPS-09: PRs into the active branch were not checked at all.
    # IN-13: nor were PRs into the `dev` integration branch.
    branches: [main, dev, bad-app]
  workflow_dispatch:  # G-12: manual trigger for E2E smoke

permissions:
  contents: read

env:
  # RV-OPS-06: the uv release that wrote uv.lock; Dockerfile pins the same
  # one (ARG UV_VERSION). Bump both together.
  UV_VERSION: "0.12.19"

# IN-07: every job has a timeout-minutes, so a hung step fails in minutes
# instead of holding the runner until GitHub's 6-hour limit.
# IN-12: runners are pinned to ubuntu-24.04: `ubuntu-latest` moves to a new
# image (Docker, Compose, system Python) without a change in this repository.

jobs:
  lint:
    # INF-M4: lint and test now run in parallel — neither has a `needs:`
    # on the other. Previously a transient ruff failure (e.g. a stale
    # cache hit) blocked the test job from even starting, hiding test
    # regressions until the lint was fixed and the whole pipeline was
    # re-run.
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # SEC-HIGH-effective-MEDIUM (issues §1.8): every third-party
      # action is pinned to a 40-char commit SHA so a compromised
      # tag (`@v4` is mutable) cannot run arbitrary code in CI.
      # Each pin is followed by the human-readable version it
      # resolved at pin time so dependabot/grep can audit drift.
      # RV-OPS-09: pin the commit a tag points to (git rev-parse
      # tag^{commit}), not the annotated tag object: setup-uv and codecov
      # carried tag-object SHAs, which are not commits and do not resolve
      # reliably as action refs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: ".python-version"

      # RV-OPS-06: uv.lock must match pyproject.toml. Every uv sync / uv export
      # below runs with --locked, so a stale lock fails instead of being
      # silently re-resolved.
      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff linter
        run: uv run ruff check .

      # NOTE: `ruff format --check` is intentionally NOT run. The
      # project uses a compact, dense style (single-line trailing-
      # comma arg lists) that the ruff formatter would explode into
      # multi-line form across ~77 files. The user's coding rule
      # is "compact, dense, idiomatic" — see AGENTS.md → Conventions.
      # Use ``ruff check`` for real correctness issues instead.

  security:
    # INF-M1: dependency vulnerability scan. pip-audit hits the PyPI
    # advisory DB and exits non-zero on any known CVE in the resolved
    # graph. Runs in parallel with lint+test so PRs see issues from
    # all three checks at once instead of serially.
    #
    # `--ignore-vuln GHSA-*` is the supported way to whitelist a CVE
    # we've evaluated and accepted; keep the list short and add a
    # comment whenever you extend it.
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: ".python-version"

      - name: Export resolved requirements
        # pip-audit needs a flat package list; uv's editable install of
        # the local kufar-analytics project would otherwise trip the
        # auditor (PyPI doesn't know about us). Exporting from uv.lock
        # also pins exactly the versions that ship in the production
        # image — no drift between audit target and runtime.
        run: uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt -o requirements.lock.txt

      - name: Run pip-audit
        # `--strict` turns warnings into errors. `--no-deps` skips the
        # transitive resolution step (we already have the full graph
        # frozen in requirements.lock.txt) which keeps the audit job
        # under a minute.
        # IN-13: a pinned auditor, so a new pip-audit release cannot change
        # the result of an unchanged lock file.
        run: uv tool run --from pip-audit==2.10.1 pip-audit --strict -r requirements.lock.txt --no-deps

  # FE-NEW-4: enforce that frontend changes refresh ?v= tags so the SW cache picks them up.
  frontend-version-gate:
    name: Frontend Version Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # IN-13: the whole history, so the base of a PR or of a
          # multi-commit push is available.
          fetch-depth: 0

      - name: Check frontend cache-busting tags
        env:
          # IN-13: compare with the PR base or with the commit before the
          # push. HEAD~1 only covered the last commit, so a JS change without
          # a bump in an earlier commit of the same push passed.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          # New branch (all-zero "before"), manual run or a force-push whose
          # old head is gone: fall back to the parent commit.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "Comparing with $base"
          if git diff --name-only "$base" HEAD | grep -qE '^frontend/(js|css)/'; then
            echo "Frontend JS/CSS changed — verifying version bump..."
            # Extract current ?v= tag
            CURRENT_V=$(grep -hoE '\?v=[A-Za-z0-9._-]+' frontend/index.html | head -1)
            # Extract current CACHE_VERSION
            CURRENT_CV=$(grep -oE 'const CACHE_VERSION = "[^"]+"' frontend/sw.js | head -1)
            # Extract base values
            BASE_V=$(git show "$base:frontend/index.html" | grep -hoE '\?v=[A-Za-z0-9._-]+' | head -1)
            BASE_CV=$(git show "$base:frontend/sw.js" | grep -oE 'const CACHE_VERSION = "[^"]+"' | head -1)
            if [[ "$CURRENT_V" == "$BASE_V" ]]; then
              echo "::error::frontend/js or frontend/css changed but ?v= tag in index.html was NOT bumped ($CURRENT_V). Run scripts/bump_static_version.sh"
              exit 1
            fi
            if [[ "$CURRENT_CV" == "$BASE_CV" ]]; then
              echo "::error::frontend/js or frontend/css changed but CACHE_VERSION in sw.js was NOT bumped. Run scripts/bump_static_version.sh"
              exit 1
            fi
            echo "✓ Version tags bumped: $CURRENT_V (was $BASE_V)"
          else
            echo "No frontend/js or frontend/css changes — skipping."
          fi

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # IN-07: ~13 minutes today; pytest-timeout (pyproject.toml) caps each
    # test, this caps the job.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kufar_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # OPUS-19 / RV-OPS-04: real Redis in CI exercises the Redis-only
      # paths (Lua INCR+EXPIRE quotas, singleflight locks, SCAN-based
      # per-user cleanup, pipelined metrics) that the MemoryCache
      # fallback skips. Until RV-OPS-04 conftest pinned :6380, so the
      # suite never reached this service; tests now take the address
      # from TEST_REDIS_URL (set on the "Run tests" step).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/kufar_test
          BOT_TOKEN: test_token
          REDIS_URL: redis://localhost:6379/0
          API_BASE_URL: https://example.com
          MINI_APP_URL: https://example.com/app
        run: uv run alembic -c migrations/alembic.ini upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/kufar_test
          # Also the server for the RV-DB-01 migration checks: each one
          # creates (and drops) its own scratch database next to this one,
          # so the role needs CREATEDB (the service's superuser has it).
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/kufar_test
          BOT_TOKEN: test_token
          # RV-OPS-04: conftest points the app, the rate limiter and the
          # Redis integration tests at TEST_REDIS_URL and flushes that DB
          # before every test — keep it on a dedicated logical DB.
          TEST_REDIS_URL: redis://localhost:6379/15
          REDIS_URL: redis://localhost:6379/15
          # RV-OPS-04: an unreachable Redis fails the Redis integration
          # tests instead of skipping them (the silent-MemoryCache mode
          # this job ran in before).
          TEST_REDIS_REQUIRED: "1"
          API_BASE_URL: https://example.com
          MINI_APP_URL: https://example.com/app
        # IN-07: --durations lists the slowest tests, so a creeping slowdown
        # shows up in the log before it reaches the timeouts.
        run: uv run --locked pytest tests/ -v --durations=20 --cov=api --cov=bot --cov=scheduler --cov-report=xml

      - name: Upload coverage to Codecov
        # SEC-LOW (issues §1.8): codecov v4 requires a token for
        # private repos; without it the upload silently no-ops.
        # CODECOV_TOKEN is provisioned as a repo secret.
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # `file` is deprecated in codecov-action v4.
          files: ./coverage.xml
          fail_ci_if_error: false

  # G-12: opt-in E2E smoke; full coverage is a follow-up.
  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --extra e2e --extra dev

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Download axe-core
        # OPS-12 / IN-13: a pinned release, and -f so an error page (404,
        # rate limit) fails the step instead of landing in axe.min.js.
        run: curl -fsSL https://cdn.jsdelivr.net/npm/axe-core@4.14.0/axe.min.js -o tests/e2e/vendor/axe.min.js

      - name: Run E2E smoke tests
        env:
          KUFAR_E2E: "1"
        run: uv run pytest tests/e2e/ --tb=short

  # RV-OPS-09: build and run the production-shaped compose stack on every push
  # and PR. OPS-01 (api/bot/scheduler unable to start on the read-only root
  # filesystem) and OPS-02 (nginx -> api 502 on Linux) went unnoticed for
  # months because no job ever started the images or built Dockerfile.frontend.
  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Base file only, as in production (no docker-compose.override.yml), plus
      # the bundled Postgres. Throwaway, URL-safe credentials for this job.
      COMPOSE_FILE: docker-compose.yml
      COMPOSE_PROFILES: local-db
      POSTGRES_PASSWORD: ci-smoke-postgres
      REDIS_PASSWORD: ci-smoke-redis
      # Well-formed but not a real token: the bot cannot log in to Telegram
      # here, so its entry point is only import-checked below.
      BOT_TOKEN: "123456:ci-smoke-not-a-real-token"
      API_BASE_URL: https://ci.example.com
      MINI_APP_URL: https://ci.example.com
      # IN-06: lets the smoke read /metrics, which ENV=production protects.
      METRICS_BEARER_TOKEN: ci-smoke-metrics-token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

      - name: Build the Python and frontend images
        # Dockerfile.frontend runs `nginx -t` on both renderings of the template.
        run: docker compose build

      - name: Start the stack
        # Returns once postgres is healthy, migrate has exited 0 and api is
        # healthy (scheduler's depends_on conditions); frontend has no
        # dependency (IN-01) and starts right away.
        run: timeout 600 docker compose up -d scheduler frontend

      - name: Api, scheduler and frontend become healthy
        # IN-06: every started service with a healthcheck, including nginx's
        # own, which nothing checked before.
        run: |
          for service in api scheduler frontend; do
            status=unknown
            for _ in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$service")")"
              if [ "$status" = "healthy" ]; then break; fi
              sleep 5
            done
            echo "$service health: $status"
            if [ "$status" != "healthy" ]; then exit 1; fi
          done

      - name: API readiness and health through nginx (frontend -> api:8000)
        # IN-06: /health/ready answers 200 with a "degraded" body when Redis is
        # unreachable (SECURITY_CACHE_REQUIRED=false), so the status code
        # alone let an api on the in-memory fallback pass.
        run: |
          ready="$(curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:8081/api/v1/health/ready)"
          echo "ready: ${ready:-<empty body>}"
          if grep -q degraded <<<"$ready"; then
            echo "::error::readiness reports a degraded dependency"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8081/api/v1/health \
            | tee /dev/stderr \
            | jq -e '.status == "healthy" and .database == "ok" and .rate_limiter == "ok"'

      - name: Metrics come from the shared Redis backend
        # IN-06: the api port is published on 127.0.0.1 only; nginx answers
        # 404 for /metrics (IN-18).
        run: |
          curl -fsS -H "Authorization: Bearer ${METRICS_BEARER_TOKEN}" http://127.0.0.1:8010/metrics \
            | grep -F 'kufar_metrics_backend_info{backend="redis"} 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/metrics)" = 404

      - name: Authenticated request through nginx
        # IN-06: initData signed with the job's BOT_TOKEN, the way Telegram
        # signs it; without initData the same route must answer 401.
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/v1/ai-consent-info)" = 401
          init_data="$(python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.parse
          fields = {
              "auth_date": str(int(time.time())),
              "user": json.dumps({"id": 777000001, "first_name": "CI"}, separators=(",", ":")),
          }
          check = "\n".join(f"{key}={value}" for key, value in sorted(fields.items()))
          secret = hmac.new(b"WebAppData", os.environ["BOT_TOKEN"].encode(), hashlib.sha256).digest()
          fields["hash"] = hmac.new(secret, check.encode(), hashlib.sha256).hexdigest()
          print(urllib.parse.urlencode(fields))
          PY
          )"
          curl -fsS -H "X-Telegram-Init-Data: ${init_data}" http://127.0.0.1:8081/api/v1/ai-consent-info \
            | jq -e '.model | length > 0'

      - name: Frontend serves the Mini App shell with its security headers
        # SC-05: static assets and sw.js keep CSP and nosniff.
        run: |
          curl -fsS http://127.0.0.1:8081/ | grep -qi '<!doctype html'
          for path in / /sw.js /js/app_bundle.js; do
            headers="$(curl -fsS -o /dev/null -D - "http://127.0.0.1:8081${path}")"
            grep -qi '^content-security-policy:' <<<"$headers"
            grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          done

      - name: Bot entry point imports in its container
        run: docker compose run --rm --no-deps bot /app/.venv/bin/python -c "import bot.main"

      - name: Service state and logs
        if: ${{ always() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # docker-build still gates on the trio — green lint + green tests +
    # clean security audit before we burn CI minutes building images.
    # RV-OPS-09: plus the compose smoke run of the same Dockerfile.
    needs: [lint, test, security, compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
