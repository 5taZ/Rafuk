name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # lint and test run independently: a red lint must not hide test or migration failures.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        # --locked: fail when uv.lock is out of date with pyproject.toml (no silent re-lock).
        run: uv sync --locked --extra dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Validate docker-compose.yml
        if: ${{ !cancelled() }}
        run: docker compose config --quiet

      - name: Check frontend JavaScript syntax
        if: ${{ !cancelled() }}
        # node --check takes one file; extra arguments would be passed to the script.
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Settings for the alembic steps. tests/conftest.py overrides them for every test (a fresh
    # SQLite file with foreign keys enforced), so pytest never touches this Postgres.
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/kufar_test
      BOT_TOKEN: test_token
      REDIS_URL: redis://localhost:6379/0
      API_BASE_URL: https://example.com
      MINI_APP_URL: https://example.com/app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kufar_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        # --locked: fail when uv.lock is out of date with pyproject.toml (no silent re-lock).
        run: uv sync --locked --extra dev

      # The migrations run against real Postgres: up, all the way down, and up again.
      - name: Run migrations
        run: uv run alembic -c migrations/alembic.ini upgrade head

      - name: Downgrade migrations to base
        run: uv run alembic -c migrations/alembic.ini downgrade base

      - name: Upgrade migrations again
        run: uv run alembic -c migrations/alembic.ini upgrade head

      # Runs even when a migration step failed. The coverage floor lives in pyproject.toml.
      - name: Run tests
        if: ${{ !cancelled() }}
        run: uv run pytest -v --cov --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kufar-analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
