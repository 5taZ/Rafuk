# INF-03: rate-limit zones (http-context).
#
# Production traffic arrives via the Cloudflared tunnel which collapses
# every tenant onto one egress IP — using $binary_remote_addr as the
# bucket key would lump all Mini-App users into a single bucket and
# DoS everyone the moment one user clicks fast. Prefer the
# CF-Connecting-IP header (Cloudflared injects it; impossible to set
# from outside) and fall back to the socket address when running
# without the tunnel (local dev).
map $http_cf_connecting_ip $rate_limit_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

# Two zones at different rates because /api/v1/ai/* analyses take
# 30-90 seconds each and have their own per-user budget enforced by
# slowapi inside FastAPI — at the edge we just need enough headroom
# for a single legitimate Mini-App session (≈ 30-60 reqs/min for the
# initial fan-out: listings, segments, history, geography, trackers)
# while denying scripted abuse.
#
#   api_burst zone  → 30 r/s with a 60-burst (10 MB ≈ 160k IPs)
#
# Per-endpoint AI budgets are enforced by slowapi inside FastAPI
# (api/limiter.py + per-route @limiter.limit decorators), so we don't
# add a second nginx-level AI zone here — duplicate limits at two
# layers tend to drift out of sync and confuse the on-call.
#
# limit_req_status 429 keeps the rejection shape consistent with what
# slowapi emits behind the proxy.
limit_req_zone $rate_limit_key zone=api_burst:10m rate=30r/s;
limit_req_status 429;

# Cap simultaneous open connections per source IP so a slowloris-shaped
# client can't tie up worker connections waiting on the 300 s AI
# read-timeout.
limit_conn_zone $rate_limit_key zone=per_ip_conn:5m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (server-level, inherited everywhere) ─────────────
    # Defence-in-depth — also enforced by FastAPI middleware for /api/.
    # `add_header` only inherits when child locations don't define their
    # own add_header, so per-location cache headers are set via `expires`
    # below (which doesn't break this inheritance).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # SEC-03/FE-01: Telegram WebApp SDK is vendored at /vendor/telegram-web-app.js
    # with a pinned SRI hash, so `https://telegram.org` is no longer a
    # permitted script source. Tightens script-src to 'self' + jsdelivr
    # (Chart.js) and shrinks the trusted CDN surface.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-ieoeWczDHkReVBsRBqaal5AFMlBtNjMzgwKvLqi/tSU='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://rms.kufar.by https://*.kufar.by data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://webk.telegram.org; upgrade-insecure-requests" always;

    # ── Compression ───────────────────────────────────────────────────────
    # Reduces JS/CSS payload by ~70% on 3G connections.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── /assets/ — separate volume mount with long cache ──────────────────
    # `^~` makes this prefix location win over the regex below for any
    # URL starting with /assets/.
    location ^~ /assets/ {
        alias /usr/share/nginx/assets/;
        expires 7d;
        try_files $uri =404;
    }

    # ── Service worker — must NOT be long-cached ─────────────────────────
    # Browsers re-fetch /sw.js with a `If-None-Match` once per ~24h
    # OR on every navigation if Cache-Control allows it. A `7d` expires
    # would pin users to an old SW for a week and break update flow,
    # so override the regex below with an explicit `^~` match.
    # Service-Worker-Allowed widens the scope to / regardless of where
    # the file is served from.
    location = /sw.js {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # ── Static-asset cache headers (everything else under /) ──────────────
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Don't cache the SPA shell — users should pick up new builds
        # within their next reload, not after a 7-day expiry.
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # `^~` so the regex above doesn't grab `/api/v1/img/foo.jpg` as a
    # static asset — image proxy responses must always travel through
    # the FastAPI app.
    location ^~ /api/ {
        # INF-03: edge rate limit + connection cap. nodelay keeps the
        # legitimate burst (initial Mini-App fan-out) snappy; sustained
        # excess is rejected as 429. The slowapi per-user limiter
        # inside FastAPI is the second line of defence — finer-grained
        # per-endpoint budgets enforced after auth.
        limit_req zone=api_burst burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # ``host.docker.internal`` resolves via /etc/hosts (Docker injects
        # the entry via ``extra_hosts: host-gateway`` at container start).
        # nginx uses libc's getaddrinfo() for literal upstream names, so
        # /etc/hosts entries ARE picked up — unlike when using a
        # ``resolver`` directive, which only queries DNS servers and
        # would ignore /etc/hosts. Build-time ``nginx -t`` is satisfied
        # by a temporary stub injected in Dockerfile.frontend.
        proxy_pass http://host.docker.internal:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        # AI analysis can take 30-90 seconds, so keep this generous.
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        # Listing assistant accepts up to 4 photos × ~1MB base64. Default
        # nginx limit (1m) would 413 the request.
        client_max_body_size 8m;

        # ── CORS — allow Telegram domains and localhost dev ──────────────
        # Use add_header here (this location overrides the server-level
        # `always` headers anyway because we need conditional CORS).
        set $cors_origin "";
        if ($http_origin ~* "^https://[a-z0-9.-]+\.telegram\.org$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~* "^http://(localhost|127\.0\.0\.1):8081$") {
            set $cors_origin $http_origin;
        }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-Telegram-Init-Data, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Telegram-Init-Data, Content-Type, Accept" always;
        add_header Vary Origin always;
        # Re-assert security headers since add_header in this location
        # disables inheritance from the server block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # SEC-03/FE-01: Telegram WebApp SDK is vendored at /vendor/telegram-web-app.js
        # with a pinned SRI hash, so `https://telegram.org` is no longer a
        # permitted script source. Tightens script-src to 'self' + jsdelivr
        # (Chart.js) and shrinks the trusted CDN surface.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-ieoeWczDHkReVBsRBqaal5AFMlBtNjMzgwKvLqi/tSU='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://rms.kufar.by https://*.kufar.by data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://webk.telegram.org; upgrade-insecure-requests" always;
    }
}
