# INF-03: rate-limit zones (http-context).
#
# Production traffic arrives via the Cloudflared tunnel, which
# collapses every tenant onto one egress IP. We only trust
# CF-Connecting-IP when the direct peer is a trusted proxy address
# (Cloudflare edge, local loopback, or Docker's 172.16/12 bridge
# range). Direct clients that hit :8081 themselves can send any header
# they want, so they stay bucketed by $binary_remote_addr.
geo $trusted_rate_limit_proxy {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    172.16.0.0/12 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    # SEC-MEDIUM (issues §1.5): Cloudflare IPv6 prefixes. Without
    # these, CF edges that proxy IPv6 traffic stay untrusted and
    # the rate-limit key falls back to the CF edge's address —
    # bucketing every IPv6 user under the same key. Mirror the
    # IPv4 list above; refresh at the cadence noted in AGENTS.md.
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$trusted_rate_limit_proxy:$http_cf_connecting_ip" $rate_limit_key {
    ~^1:(.+)$ $1;
    default $binary_remote_addr;
}

# Two zones at different rates because /api/v1/ai/* analyses take
# 30-90 seconds each and have their own per-user budget enforced by
# FastAPI-side AI quota guards — at the edge we just need enough headroom
# for a single legitimate Mini-App session (≈ 30-60 reqs/min for the
# initial fan-out: listings, segments, history, geography, trackers)
# while denying scripted abuse.
#
#   api_burst zone  → 30 r/s with a 60-burst (10 MB ≈ 160k IPs)
#
# Per-endpoint AI budgets are enforced inside FastAPI by the AI routers'
# `_check_rate_limit` guards, so we don't add a second nginx-level AI
# zone here — duplicate limits at two layers tend to drift out of sync
# and confuse the on-call.
#
# limit_req_status 429 keeps the rejection shape consistent with what
# slowapi emits behind the proxy.
limit_req_zone $rate_limit_key zone=api_burst:10m rate=30r/s;
limit_req_status 429;

# Cap simultaneous open connections per source IP so a slowloris-shaped
# client can't tie up worker connections waiting on the 300 s AI
# read-timeout.
limit_conn_zone $rate_limit_key zone=per_ip_conn:5m;

server {
    # SEC-NEW-9: nginx-unprivileged listens on 8080 (non-root can't bind <1024).
    listen 8080;
    server_name _;

    # SEC-MEDIUM (issues §1.2): hide nginx version from Server: header
    # and default error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (server-level, inherited everywhere) ─────────────
    # Defence-in-depth — also enforced by FastAPI middleware for /api/.
    # `add_header` only inherits when child locations don't define their
    # own add_header, so per-location cache headers are set via `expires`
    # below (which doesn't break this inheritance).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # SEC-LOW (issues §1.2): HSTS at the server level so static
    # assets served by nginx (not just /api/ via FastAPI) carry the
    # header. 1y / includeSubDomains is the standard floor.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # SEC-03/FE-01: Telegram WebApp SDK is vendored at /vendor/telegram-web-app.js
    # with a pinned SRI hash, so `https://telegram.org` is no longer a
    # permitted script source. Chart.js and fonts are vendored locally,
    # keeping third-party CDN requests out of the pre-consent path.
    # The legacy XFO header is intentionally omitted: SAMEORIGIN would
    # block Telegram's WebView, while CSP frame-ancestors names the
    # allowed embedding origins precisely.
    # OPUS-14 wave 75: the sha256 hash in script-src covers the tiny
    # inline script that Telegram WebView injects into every Mini-App
    # page on cold start (theme/viewport/keyboard hooks). It lives
    # outside the repo so `grep` can't find it. Dropped in wave 62
    # on the mistaken assumption the hash was dead; restored here
    # after the browser console started logging "CSP blocked an
    # inline script (script-src-elem) × 2" on every open. Pins
    # exactly that Telegram shim; every other inline script still
    # trips the policy.
    # SEC-LOW (issues §1.2): frame-ancestors now lists webz.telegram.org
    # alongside web.telegram.org / webk.telegram.org so the Telegram
    # Web Z client can embed the Mini App.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ieoeWczDHkReVBsRBqaal5AFMlBtNjMzgwKvLqi/tSU='; style-src 'self'; font-src 'self'; img-src 'self' https://rms.kufar.by https://*.kufar.by data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org; upgrade-insecure-requests" always;

    # ── Compression ───────────────────────────────────────────────────────
    # Reduces JS/CSS payload by ~70% on 3G connections.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── /assets/ — separate volume mount with long cache ──────────────────
    # `^~` makes this prefix location win over the regex below for any
    # URL starting with /assets/.
    location ^~ /assets/ {
        alias /usr/share/nginx/assets/;
        expires 7d;
        try_files $uri =404;
    }

    # ── Service worker — must NOT be long-cached ─────────────────────────
    # Browsers re-fetch /sw.js with a `If-None-Match` once per ~24h
    # OR on every navigation if Cache-Control allows it. A `7d` expires
    # would pin users to an old SW for a week and break update flow,
    # so override the regex below with an explicit `^~` match.
    # Service-Worker-Allowed widens the scope to / regardless of where
    # the file is served from.
    location = /sw.js {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # ── Static-asset cache headers (everything else under /) ──────────────
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Don't cache the SPA shell — users should pick up new builds
        # within their next reload, not after a 7-day expiry.
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # OPUS-11: gzip is fine for anonymous analytics (price-stats,
    # listings, geography, segments — same body for every user) but
    # presents a theoretical BREACH side-channel for endpoints that
    # echo per-user attacker-controllable text (notes, query) inside
    # responses to a different user. The realistic exploit is rate-
    # limited away by slowapi, but disabling compression on the few
    # PII surfaces removes the surface entirely while still letting
    # the bulky analytics responses compress.
    location ^~ /api/v1/account/ {
        gzip off;
        limit_req zone=api_burst burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://host.docker.internal:8010/api/v1/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        client_max_body_size 8m;
    }

    location ^~ /api/v1/leads {
        gzip off;
        limit_req zone=api_burst burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://host.docker.internal:8010/api/v1/leads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        client_max_body_size 8m;
    }

    location ^~ /api/v1/watchlist {
        gzip off;
        limit_req zone=api_burst burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://host.docker.internal:8010/api/v1/watchlist;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        client_max_body_size 8m;
    }

    # `^~` so the regex above doesn't grab `/api/v1/img/foo.jpg` as a
    # static asset — image proxy responses must always travel through
    # the FastAPI app.
    location ^~ /api/ {
        # INF-03: edge rate limit + connection cap. nodelay keeps the
        # legitimate burst (initial Mini-App fan-out) snappy; sustained
        # excess is rejected as 429. The slowapi per-user limiter
        # inside FastAPI is the second line of defence — finer-grained
        # per-endpoint budgets enforced after auth.
        limit_req zone=api_burst burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # ``host.docker.internal`` resolves via /etc/hosts (Docker injects
        # the entry via ``extra_hosts: host-gateway`` at container start).
        # nginx uses libc's getaddrinfo() for literal upstream names, so
        # /etc/hosts entries ARE picked up — unlike when using a
        # ``resolver`` directive, which only queries DNS servers and
        # would ignore /etc/hosts. Build-time ``nginx -t`` is satisfied
        # by a temporary stub injected in Dockerfile.frontend.
        proxy_pass http://host.docker.internal:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        # AI analysis can take 30-90 seconds, so keep this generous.
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        # Listing assistant accepts up to 4 photos × ~1MB base64. Default
        # nginx limit (1m) would 413 the request.
        client_max_body_size 8m;

        # ── CORS — allow Telegram domains and localhost dev ──────────────
        # Use add_header here (this location overrides the server-level
        # `always` headers anyway because we need conditional CORS).
        #
        # PR-19: tightened from ``^https://[a-z0-9.-]+\.telegram\.org$``
        # (every subdomain under ``telegram.org``) to an explicit
        # allowlist of the three Mini-App embedders. Telegram owns the
        # apex so the wildcard never let a third party in directly,
        # but a future subdomain takeover on something like
        # ``preview.telegram.org`` would have inherited CORS for free.
        # Spelling the embedders out keeps the trust boundary small
        # and matches the FastAPI-side CORS/CSRF allowlists in
        # ``api.main``.
        set $cors_origin "";
        if ($http_origin = "https://web.telegram.org") {
            set $cors_origin $http_origin;
        }
        if ($http_origin = "https://webk.telegram.org") {
            set $cors_origin $http_origin;
        }
        if ($http_origin = "https://webz.telegram.org") {
            set $cors_origin $http_origin;
        }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-Telegram-Init-Data, X-Requested-With, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Telegram-Init-Data, X-Requested-With, Content-Type, Accept" always;
        add_header Vary Origin always;
        # Re-assert security headers since add_header in this location
        # disables inheritance from the server block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # SEC-NEW-3: HSTS is set at the server level but `add_header` here
        # disables inheritance, so we have to repeat it.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # SEC-03/FE-01: Telegram WebApp SDK is vendored at /vendor/telegram-web-app.js
        # with a pinned SRI hash, so `https://telegram.org` is no longer a
        # permitted script source. Chart.js and fonts are vendored locally,
        # keeping third-party CDN requests out of the pre-consent path.
        # The legacy XFO header is intentionally omitted; see the
        # server-level CSP comment above.
        # OPUS-14 wave 75: same Telegram-WebView-shim hash as the
        # server-level CSP above. add_header in this location block
        # disables inheritance, so the policy must be repeated
        # verbatim including the sha256 allowlist.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ieoeWczDHkReVBsRBqaal5AFMlBtNjMzgwKvLqi/tSU='; style-src 'self'; font-src 'self'; img-src 'self' https://rms.kufar.by https://*.kufar.by data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org; upgrade-insecure-requests" always;
    }
}
