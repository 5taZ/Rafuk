services:
  # NOTE: resource limits are deliberately conservative — they're sized
  # for a single-host dev deployment, not for production scale. Limits
  # are enforced by docker compose v2 even outside swarm mode.
  # `restart: unless-stopped` ensures crashed services come back without
  # auto-restarting after an explicit `docker compose down`.

  # INF-M3: one-shot migration runner. Previously the api service started
  # uvicorn directly and the first request would fail (or worse, succeed
  # against a half-migrated schema) until somebody manually ran
  # `alembic upgrade head` against the live DB. Wiring migrations into a
  # dedicated service that completes before api/bot/scheduler boot makes
  # the dependency chain explicit:
  #     migrate (one-shot)  →  api (long-running)
  #                          →  bot, scheduler (depend on api healthy)
  # `restart: "no"` keeps it from looping after a successful run.
  migrate:
    build: .
    restart: "no"
    command: ["uv", "run", "alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build: .
    restart: unless-stopped
    environment:
      SERVICE: api
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
      KUFAR_REQUEST_DELAY: ${KUFAR_REQUEST_DELAY:-1.0}
      KUFAR_PARALLEL_SEMAPHORE: ${KUFAR_PARALLEL_SEMAPHORE:-3}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-30}
    depends_on:
      redis:
        condition: service_healthy
      # INF-M3: hard requirement — api must not start until alembic
      # has finished. ``service_completed_successfully`` waits for
      # the migrate container to exit 0; a failed migration blocks
      # the whole stack rather than letting api come up half-broken.
      migrate:
        condition: service_completed_successfully
    ports:
      - "8010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # API holds the FastAPI app + httpx pools + AI cache layer.
          # 1G is enough for ~4 uvicorn workers under typical load;
          # raise if you bump the worker count.
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    environment:
      SERVICE: bot
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # Telegram bot is mostly httpx polling — light footprint.
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 96M
          cpus: "0.1"
    # INF-H6: real HTTP liveness/readiness instead of "pgrep python".
    # The bot starts an aiohttp server on BOT_HEALTH_PORT (8001 by
    # default) that returns 200 when the event loop is turning and
    # a DB "SELECT 1" succeeds.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      SERVICE: scheduler
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-30}
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # Scheduler periodically fans out to Kufar; spikes during
          # snapshot windows but mostly idle. Memory bumped to handle
          # the snapshot batch (load all trackers + market stats).
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 96M
          cpus: "0.1"
    # INF-H6: same HTTP healthcheck story as the bot service —
    # SCHEDULER_HEALTH_PORT defaults to 8002 and is served by the
    # background aiohttp app registered in scheduler.collector.main().
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # INF-H7: previously this used the upstream nginx:1.27-alpine
    # image with three :ro bind mounts (frontend/, assets/, the
    # nginx config). Now we bake the bundle into a dedicated image
    # — single deploy artifact, atomic rollouts, immutable in
    # production. See Dockerfile.frontend for the build.
    #
    # In local dev you can still get hot-reload by overriding the
    # build with a docker-compose.override.yml that re-adds the
    # bind mounts; we don't ship that file because it is per-developer
    # ergonomics, not a service contract.
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Wave 25.2: ``nginx -t`` inside the Dockerfile resolves the
      # literal ``host.docker.internal`` upstream in nginx.conf at
      # config-load time. The build sandbox normally doesn't have
      # that entry — the runtime ``extra_hosts`` below only kicks in
      # at container START. BuildKit's ``build.extra_hosts``
      # injects a /etc/hosts entry visible to RUN steps. The build-
      # time value is a no-op stub (127.0.0.1) because nothing in
      # the build phase actually talks to it; runtime resolution is
      # supplied by Docker's host-gateway entry below.
      extra_hosts:
        - "host.docker.internal:127.0.0.1"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # nginx serves static + a tiny CSP/headers layer; 64M is plenty.
          memory: 96M
          cpus: "0.25"
        reservations:
          memory: 16M
          cpus: "0.05"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # Redis requires AUTH. REDIS_PASSWORD must be set in .env (generate
    # with `openssl rand -hex 32`). Without --requirepass, anyone with
    # localhost access can read every cache entry, session token, and
    # rate-limit counter.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 192mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Note: port 6380 exposed for local debugging. Remove in production.
    ports:
      - "6380:6379"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # Redis maxmemory inside the server is set to 192M (LRU on
          # eviction); container-level cap is 256M to absorb fork-and-
          # save overhead for AOF rewrites.
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2024.12.1
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kufar-net
    profiles: ["tunnel"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"

  # INF-01: optional local PostgreSQL. Production uses an external
  # managed Postgres (DATABASE_URL points to host.docker.internal or
  # a cloud DSN). This service is OFF by default — start it with
  #     docker compose --profile local-db up
  # to spin up a self-contained dev stack without depending on the
  # host's Postgres. If you switch to this, also point DOCKER_DATABASE_URL
  # at `postgresql+asyncpg://kufar:kufar@postgres:5432/kufar`.
  #
  # The volume keeps data across `compose down` cycles; `compose down
  # -v` wipes it. Resource limits are tuned for a dev box, not for
  # serving real traffic.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kufar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kufar}
      POSTGRES_DB: ${POSTGRES_DB:-kufar}
      # Keep PG locale aligned with the application — Russian/Belarusian
      # text in listings needs UTF-8 collation that "C.UTF-8" provides.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kufar} -d ${POSTGRES_DB:-kufar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kufar-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
