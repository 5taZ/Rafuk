# SEC-NEW-1: cap_drop ALL + no-new-privileges + read_only by default. Writable scratch via tmpfs:/tmp.
name: myprojetctkufar

# RV-OPS-02: the Python services reach Postgres and Redis by service name over
# kufar-net. The host-mode DATABASE_URL / REDIS_URL from .env (localhost:5433 /
# localhost:6380) point at the container itself here, and host.docker.internal
# cannot reach ports published on 127.0.0.1 on a Linux Docker Engine. Set
# DOCKER_DATABASE_URL / DOCKER_REDIS_URL only to use other servers (e.g. a
# managed database). POSTGRES_USER, POSTGRES_PASSWORD and REDIS_PASSWORD are
# inserted into these URLs verbatim, so keep them URL-safe (`openssl rand -hex
# 32` is); otherwise set the DOCKER_* URLs with percent-encoded passwords.
x-database-url: &database-url "${DOCKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-kufar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kufar}}"
x-redis-url: &redis-url "${DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}"

# OPS-07: the Settings fields (api/config.py) the containers get. Unlike the
# host processes, the containers do not read .env (it never enters the image),
# so a field missing here silently kept its code default in the stack. Every
# default below equals the api/config.py default (the exceptions are commented),
# so an unset variable keeps the previous behaviour; set it in .env to change
# it. tests/test_docker_config.py fails when a Settings field is neither passed
# nor allowlisted there, and when a default here drifts from api/config.py.
x-app-env: &app-env
  ENV: ${ENV:-production}
  DEBUG: ${DEBUG:-false}
  AUTH_BYPASS: ${AUTH_BYPASS:-false}
  # IN-11: an unset token started api "healthy" with every initData rejected
  # and the bot in a crash loop; compose now refuses to start instead.
  BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN must be set in .env}
  DATABASE_URL: *database-url
  REDIS_URL: *redis-url
  API_BASE_URL: ${API_BASE_URL}
  MINI_APP_URL: ${MINI_APP_URL}
  # Read by api/logging_config.py in every service and by uvicorn (--log-level,
  # lowercase) in the api service.
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # IN-19: per process. Worst case api WORKERS x (size + overflow) + bot +
  # scheduler must stay under Postgres max_connections (100 by default).
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  # SEC-06 / G-03..G-05 production policy gates (lax defaults, see
  # api/config.py); the api and the bot both read them.
  SECURITY_CACHE_REQUIRED: ${SECURITY_CACHE_REQUIRED:-false}
  INTERNAL_SERVICE_TOKEN_REQUIRED: ${INTERNAL_SERVICE_TOKEN_REQUIRED:-false}
  ALLOW_LEGACY_BOT_INITDATA: ${ALLOW_LEGACY_BOT_INITDATA:-true}

# OPS-07: Kufar client and tracker settings, shared by api and scheduler.
x-kufar-env: &kufar-env
  KUFAR_REQUEST_DELAY: ${KUFAR_REQUEST_DELAY:-1.0}
  KUFAR_TIMEOUT: ${KUFAR_TIMEOUT:-15.0}
  KUFAR_MAX_ADS_PER_QUERY: ${KUFAR_MAX_ADS_PER_QUERY:-1500}
  ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-30}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  AUTO_REMOVE_MISSING_DAYS: ${AUTO_REMOVE_MISSING_DAYS:-7}

services:
  # NOTE: resource limits are deliberately conservative — they're sized
  # for a single-host dev deployment, not for production scale. Limits
  # are enforced by docker compose v2 even outside swarm mode.
  # `restart: unless-stopped` ensures crashed services come back without
  # auto-restarting after an explicit `docker compose down`.

  # INF-M3: one-shot migration runner. Previously the api service started
  # uvicorn directly and the first request would fail (or worse, succeed
  # against a half-migrated schema) until somebody manually ran
  # `alembic upgrade head` against the live DB. Wiring migrations into a
  # dedicated service that completes before api/bot/scheduler boot makes
  # the dependency chain explicit:
  #     migrate (one-shot)  →  api (long-running)
  #                          →  bot, scheduler (depend on api healthy)
  # `restart: "no"` keeps it from looping after a successful run.
  migrate:
    build: .
    restart: "no"
    # SEC-NEW-1: one-shot — read_only + tmpfs:/tmp for alembic temp files.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # RV-OPS-01: the image CMD runs /app/.venv/bin/alembic for SERVICE=migrate,
    # like the other services; the old `uv run --no-sync` command needed a
    # tmpfs uv cache (UV_CACHE_DIR) on this read-only container.
    environment:
      <<: *app-env
      SERVICE: migrate
    depends_on:
      # RV-OPS-02: wait for the bundled database instead of failing the one-shot
      # run on a cold start. required: false (Compose >= 2.20) keeps the
      # dependency optional: without the local-db profile the postgres service
      # does not exist and DOCKER_DATABASE_URL points at an external database.
      postgres:
        condition: service_healthy
        required: false
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # SEC-NEW-2: bind to loopback in base; production ingress is cloudflared -> frontend -> api over the bridge net.
  api:
    build: .
    restart: unless-stopped
    # SEC-NEW-1: Python tempfile/Pillow need /tmp writable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: [*app-env, *kufar-env]
      SERVICE: api
      # PERF-H1: uvicorn worker processes (the Dockerfile default is 4). Raise
      # DB_POOL_* budgeting and the cpus/memory limits below together with it.
      WORKERS: ${WORKERS:-4}
      # Deliberately above the api/config.py default (2) for the api's
      # request fan-out; the scheduler keeps 2.
      KUFAR_PARALLEL_SEMAPHORE: ${KUFAR_PARALLEL_SEMAPHORE:-3}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      REPLAY_AUTOBLOCK_ENABLED: ${REPLAY_AUTOBLOCK_ENABLED:-false}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-7200}
      # OPUS-12: shared with the bot via env so /api/v1/leads etc.
      # can accept service-token auth on the bot's behalf.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # SEC-NEW-8: blank falls back to the BOT_TOKEN-derived key.
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:-}
      AI_AUDIT_REQUIRED: ${AI_AUDIT_REQUIRED:-false}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-8388608}
      MAX_TRACKERS_PER_USER: ${MAX_TRACKERS_PER_USER:-50}
      MAX_DEAL_ADS_PER_QUERY: ${MAX_DEAL_ADS_PER_QUERY:-20}
      MAX_OPPORTUNITY_ITEMS: ${MAX_OPPORTUNITY_ITEMS:-12}
      MAX_OPPORTUNITY_SIGNALS: ${MAX_OPPORTUNITY_SIGNALS:-4}
      MAX_SAVED_SEARCHES_FOR_BOARD: ${MAX_SAVED_SEARCHES_FOR_BOARD:-8}
      MAX_RECENT_TRACKER_EVENTS: ${MAX_RECENT_TRACKER_EVENTS:-6}
      AI_API_KEY: ${AI_API_KEY:-}
      # OPUS-5: align default base URL with default model.
      # gemini-2.5-flash is served by Google, not Together — the
      # previous default would 404 unless ops also overrode AI_MODEL.
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      AI_ANALYSIS_MODEL: ${AI_ANALYSIS_MODEL:-}
      AI_LISTING_ASSISTANT_MODEL: ${AI_LISTING_ASSISTANT_MODEL:-}
      # Blank: the consent screen derives provider and region from AI_BASE_URL.
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-}
      AI_PROVIDER_REGION: ${AI_PROVIDER_REGION:-}
      AI_PROXY_URL: ${AI_PROXY_URL:-}
      AI_MAX_IMAGES: ${AI_MAX_IMAGES:-3}
      AI_CACHE_HOURS: ${AI_CACHE_HOURS:-1}
      AI_HOURLY_LIMIT: ${AI_HOURLY_LIMIT:-10}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-50}
      AI_ANALYSIS_TIMEOUT: ${AI_ANALYSIS_TIMEOUT:-150}
      AI_QUICK_CONDITION_TIMEOUT: ${AI_QUICK_CONDITION_TIMEOUT:-45}
      AI_PHOTO_PRECHECK_TIMEOUT: ${AI_PHOTO_PRECHECK_TIMEOUT:-30}
      AI_PHOTO_PRECHECK_ENABLED: ${AI_PHOTO_PRECHECK_ENABLED:-false}
      AI_CHAT_MIN_INTERVAL_SECONDS: ${AI_CHAT_MIN_INTERVAL_SECONDS:-1.5}
      AI_TASK_TTL: ${AI_TASK_TTL:-3600}
      AI_FALLBACK_CACHE_TTL: ${AI_FALLBACK_CACHE_TTL:-1800}
      IMAGE_PROXY_ENABLED: ${IMAGE_PROXY_ENABLED:-true}
      IMAGE_PROXY_MAX_WIDTH: ${IMAGE_PROXY_MAX_WIDTH:-1024}
      IMAGE_PROXY_QUALITY: ${IMAGE_PROXY_QUALITY:-80}
      IMAGE_PROXY_FETCH_TIMEOUT: ${IMAGE_PROXY_FETCH_TIMEOUT:-5.0}
      IMAGE_PROXY_MAX_BYTES: ${IMAGE_PROXY_MAX_BYTES:-5242880}
    depends_on:
      redis:
        condition: service_healthy
      # INF-M3: hard requirement — api must not start until alembic
      # has finished. ``service_completed_successfully`` waits for
      # the migrate container to exit 0; a failed migration blocks
      # the whole stack rather than letting api come up half-broken.
      migrate:
        condition: service_completed_successfully
    # Debug access from the host only; nginx reaches api:8000 over kufar-net.
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # API holds the FastAPI app + httpx pools + AI cache layer.
          # 1G is enough for ~4 uvicorn workers under typical load;
          # raise if you bump the worker count.
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    # SEC-NEW-1: Python tempfile needs /tmp writable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *app-env
      SERVICE: bot
      # OPUS-12: shared with api via env so the bot can authenticate
      # callbacks against the API without forging initData.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # Telegram bot is mostly httpx polling — light footprint.
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 96M
          cpus: "0.1"
    # INF-H6: real HTTP liveness/readiness instead of "pgrep python".
    # The bot starts an aiohttp server on BOT_HEALTH_PORT (8001 by
    # default) that returns 200 when the event loop is turning and
    # a DB "SELECT 1" succeeds.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build: .
    restart: unless-stopped
    # SEC-NEW-1: Python tempfile needs /tmp writable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: [*app-env, *kufar-env]
      SERVICE: scheduler
      # The api/config.py default; the api service runs with 3.
      KUFAR_PARALLEL_SEMAPHORE: ${KUFAR_PARALLEL_SEMAPHORE:-2}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # Scheduler periodically fans out to Kufar; spikes during
          # snapshot windows but mostly idle. Memory bumped to handle
          # the snapshot batch (load all trackers + market stats).
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 96M
          cpus: "0.1"
    # INF-H6: same HTTP healthcheck story as the bot service —
    # SCHEDULER_HEALTH_PORT defaults to 8002 and is served by the
    # background aiohttp app registered in scheduler.collector.main().
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # INF-H7: previously this used the upstream nginx:1.27-alpine
    # image with three :ro bind mounts (frontend/, assets/, the
    # nginx config). Now we bake the bundle into a dedicated image
    # — single deploy artifact, atomic rollouts, immutable in
    # production. See Dockerfile.frontend for the build.
    #
    # In local dev you can still get hot-reload by re-adding the bind
    # mounts in a docker-compose.override.yml (the nginx config goes to
    # /etc/nginx/templates/default.conf.template, see RV-OPS-02 below);
    # the shipped override only publishes Redis for start-local.sh.
    # RV-OPS-02: Dockerfile.frontend's build-time `nginx -t` renders the
    # upstream template with values that need no DNS, so the old
    # build.extra_hosts stub for host.docker.internal is gone.
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    # SEC-NEW-1: fully read_only; nginx-unprivileged needs /tmp, /var/cache/nginx, /var/run writable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      # RV-OPS-02: the image entrypoint renders nginx/default.conf (an
      # envsubst template) into conf.d at start; on the read-only root
      # filesystem it would skip that silently without a writable conf.d.
      # The tmpfs must belong to the nginx user (uid/gid 101 in
      # nginx-unprivileged): a root-owned one is just as unwritable, and
      # nginx then starts without any server block (RV-OPS-09 smoke caught it).
      - /etc/nginx/conf.d:uid=101,gid=101
    environment:
      # RV-OPS-02: host:port the /api/ locations proxy to. The default is the
      # api service over kufar-net; start-local.sh passes
      # NGINX_API_UPSTREAM=host.docker.internal:8010 for the API on the host.
      API_UPSTREAM: ${NGINX_API_UPSTREAM:-api:8000}
      # Parameters of that upstream server: "resolve" makes nginx follow a
      # recreated api container to its new address. start-local.sh passes an
      # empty value because host.docker.internal exists only in /etc/hosts,
      # which nginx's runtime resolver does not read. No ":" in the default on
      # purpose: an explicitly empty value must stay empty.
      API_UPSTREAM_PARAMS: ${NGINX_API_UPSTREAM_PARAMS-resolve}
    # Only start-local.sh host mode uses it (the API runs on the host there).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # IN-01: no depends_on on api. nginx serves the static shell on its own and
    # follows a recreated api through "resolve" above; waiting for a healthy
    # api tied the shell to Postgres/Redis health, and `restart: true` cut
    # static downloads and long AI requests whenever compose recreated api.
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # nginx serves static + a tiny CSP/headers layer; 64M is plenty.
          memory: 96M
          cpus: "0.25"
        reservations:
          memory: 16M
          cpus: "0.05"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # SEC-NEW-1: cap_drop + no-new-privileges. `read_only: true` is
    # not compatible with Redis AOF — the rewriter needs a writable
    # rootfs for temp files alongside the /data volume. cap_drop:ALL
    # strips CAP_SETUID/CAP_SETGID so the default gosu-based entrypoint
    # fails; instead run directly as the redis user (uid 999) and pass
    # redis-server as the entrypoint to bypass the gosu wrapper.
    user: "999:1000"
    entrypoint: ["redis-server"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - redis-data:/data
    # RV-OPS-02: no fallback password, like POSTGRES_PASSWORD (PR-14): an unset
    # value silently started Redis without AUTH. The services build REDIS_URL
    # from the same variable (x-redis-url above).
    command: ["--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # PR-18: no host port mapping in the base compose. Other services
    # in the kufar-net bridge network reach Redis at ``redis:6379``
    # without it. Local development that needs to talk to the
    # containerised Redis from outside the compose project (e.g.
    # ``start-local.sh`` running uvicorn on the host) gets the port
    # via ``docker-compose.override.yml`` — the override is auto-
    # loaded by ``docker compose up``, so dev workflow is unchanged,
    # but a production deploy that uses ``docker compose -f docker-compose.yml up``
    # never publishes the port. Previously the host port lived inline
    # here with a "Remove in production" comment that was easy to
    # miss on copy-paste deploys.
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          # Redis maxmemory inside the server is set to 192M (LRU on
          # eviction); container-level cap is 256M to absorb fork-and-
          # save overhead for AOF rewrites.
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    # OPS-14: bounded logs like every other service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2024.12.1
    restart: unless-stopped
    # SEC-NEW-1: stateless tunnel client — fully read_only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # IN-01: the tunnel forwards to nginx (frontend), not to the api.
    depends_on:
      frontend:
        condition: service_started
    networks:
      - kufar-net
    profiles: ["tunnel"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"
    # OPS-14: bounded logs like every other service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # INF-01: local PostgreSQL is profile-gated for compose-only deploys,
  # but start-local.sh always starts it explicitly. Keeping the database
  # inside this compose project prevents accidental connections to another
  # project that happens to publish localhost:5433.
  #
  # The volume keeps data across `compose down` cycles; `compose down
  # -v` wipes it. Resource limits are tuned for a dev box, not for
  # serving real traffic.
  #
  # RV-OPS-02: the containers use it as postgres:5432 over kufar-net
  # (x-database-url), so a full stack on this database needs
  # `--profile local-db`. The 127.0.0.1:5433 port below serves only the
  # host processes of start-local.sh.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # SEC-NEW-1: the postgres entrypoint runs as root, chown's the
    # data dir to the postgres user, then gosu's down. cap_drop:ALL
    # blocks chown+gosu, so add back exactly the capabilities the
    # entrypoint needs (CHOWN/FOWNER for chown+chmod, DAC_OVERRIDE
    # so root reads files owned by other UIDs, SETGID/SETUID for gosu).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kufar}
      # PR-14: no fallback password. The previous ``${POSTGRES_PASSWORD:-kufar}``
      # silently span up a Postgres instance accepting ``kufar/kufar`` whenever
      # the operator forgot to populate ``.env`` — a foot-gun on copy-paste
      # deploys. Without a default, ``docker compose up`` fails fast with
      # "POSTGRES_PASSWORD is not set" instead. Generate a strong value:
      #     openssl rand -hex 32
      # then put it in ``.env`` as ``POSTGRES_PASSWORD=...`` (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kufar}
      # Keep PG locale aligned with the application — Russian/Belarusian
      # text in listings needs UTF-8 collation that "C.UTF-8" provides.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - kufar-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kufar} -d ${POSTGRES_DB:-kufar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kufar-net:
    driver: bridge

volumes:
  redis-data:
  pgdata:
