services:
  api:
    build: .
    environment:
      SERVICE: api
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
      KUFAR_REQUEST_DELAY: ${KUFAR_REQUEST_DELAY:-1.0}
      KUFAR_PARALLEL_SEMAPHORE: ${KUFAR_PARALLEL_SEMAPHORE:-3}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-30}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot:
    build: .
    environment:
      SERVICE: bot
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build: .
    environment:
      SERVICE: scheduler
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-30}
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./assets:/usr/share/nginx/assets:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
