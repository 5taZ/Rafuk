[alembic]
script_location = migrations
prepend_sys_path = .
# TEST-M6: explicit path separator silences Alembic 1.18+ deprecation
# warning about legacy splitting on spaces/commas/colons. ``os`` uses
# os.pathsep, which is platform-correct.
path_separator = os
sqlalchemy.url = postgresql+asyncpg://user:pass@db:5432/kufar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
